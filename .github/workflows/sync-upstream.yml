name: Sync Upstream

on:
  schedule:
    - cron: '30 4 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name 'github-actions'
          git config user.email 'actions@github.com'
      - name: Add upstream remote
        run: git remote add upstream https://github.com/mtvpls/MoonTVPlus.git || true
      - name: Fetch upstream
        run: git fetch upstream
      - name: Merge upstream main
        id: merge
        run: git merge upstream/main --no-edit
      - name: Get new commit SHA
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
      - name: Push ref via API
        env:
          GH_TOKEN: ${{ secrets.PUSH_TOKEN }}
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -X PUT \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/lzylipu/MoonTVPlus/git/refs/heads/main \
            -d '{"sha":"${{ steps.sha.outputs.sha }}"}')
          echo "push API -> HTTP $code"
          # 200=已更新; 422=ref已指向同commno无变化(上游没新commit); 其余为真错误
          if [ "$code" != "200" ] && [ "$code" != "204" ] && [ "$code" != "422" ]; then
            echo "::error::push failed with HTTP $code"
            exit 1
          fi
